<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLC Command Center</title>
<link rel="stylesheet" href="design-system.css">
<style>
/* ── CLC Scheduler-inspired palette ── */
:root{
  --pd:#0f172a;--pm:#1e1b4b;--pl:#8b5bb8;--pp:#f0e8ff;
  --gold:#c9a227;--gl:#f5e06e;--gp:#fef9e7;
  --text:#1a1a2e;--muted:#6b6b8a;
  --red:#dc2626;--green:#16a34a;--white:#fff;
  --card:rgba(255,255,255,.06);--border:rgba(255,255,255,.08);
  --radius:12px;--font:system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:linear-gradient(135deg,var(--pd),var(--pm));min-height:100vh}
body{
  font-family:var(--font);color:#e2e8f0;min-height:100vh;
  display:flex;flex-direction:column;
  background:radial-gradient(circle at 72% 18%,rgba(139,91,184,.13),transparent 45%),
             radial-gradient(circle at 28% 78%,rgba(201,162,39,.08),transparent 40%);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{
  background:rgba(255,255,255,.07);border:1px solid var(--border);
  color:#e2e8f0;border-radius:8px;padding:10px 12px;width:100%;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.15)}
select option{background:var(--pd);color:#e2e8f0}

/* ── Header ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 16px;background:rgba(15,23,42,.85);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;color:var(--gold)}
.brand small{font-size:10px;display:block;color:var(--muted);font-weight:400;letter-spacing:.08em}
.phi-badge{font-size:9px;background:var(--red);color:#fff;padding:3px 8px;border-radius:99px;font-weight:800;letter-spacing:.06em}

/* ── Tab navigation ── */
.tab-bar{
  display:flex;gap:2px;padding:8px 12px;background:rgba(0,0,0,.3);
  border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;
}
.tab-bar button{
  padding:10px 18px;border-radius:8px 8px 0 0;font-size:13px;font-weight:700;
  color:var(--muted);white-space:nowrap;transition:.15s;
}
.tab-bar button:hover{color:#e2e8f0;background:rgba(255,255,255,.04)}
.tab-bar button.active{color:var(--gold);background:rgba(201,162,39,.1);border-bottom:2px solid var(--gold)}

/* ── Main workspace ── */
.workspace{flex:1;padding:16px;overflow:auto}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ── Stat cards ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.stat-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;text-align:center;
}
.stat-card b{display:block;font-size:36px;font-weight:900;color:var(--gold);line-height:1}
.stat-card span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:6px}
.stat-card.warn b{color:var(--red)}

/* ── Cards / panels ── */
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;margin-bottom:12px;
}
.card-header{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;
  font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);
}
.card-header h2{font-size:15px;color:#e2e8f0;text-transform:none;letter-spacing:0}

/* ── Grid layouts ── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}

/* ── Alert items ── */
.alert-item{
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  padding:10px;margin-bottom:6px;border-radius:8px;font-size:13px;
}
.alert-item.crit{background:rgba(220,38,38,.12);border-left:3px solid var(--red)}
.alert-item.warn{background:rgba(201,162,39,.1);border-left:3px solid var(--gold)}
.alert-item .alert-dot{width:8px;height:8px;border-radius:50%}
.alert-item.crit .alert-dot{background:var(--red)}
.alert-item.warn .alert-dot{background:var(--gold)}

/* ── Appointment row ── */
.appt-row{
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  padding:10px;border-radius:8px;margin-bottom:4px;cursor:pointer;font-size:13px;
  border:1px solid transparent;transition:.15s;
}
.appt-row:hover{background:rgba(255,255,255,.04);border-color:var(--border)}
.appt-time{font-weight:800;color:var(--gold);min-width:70px}
.appt-name{font-weight:700}.appt-detail{font-size:11px;color:var(--muted)}
.appt-status{font-size:10px;padding:3px 8px;border-radius:99px;font-weight:700;white-space:nowrap}
.status-pending{background:rgba(201,162,39,.15);color:var(--gold)}
.status-confirmed{background:rgba(22,163,74,.15);color:var(--green)}
.status-departed{background:rgba(139,91,184,.15);color:var(--pl)}
.status-complete{background:rgba(100,116,139,.12);color:var(--muted)}

/* ── Calendar ── */
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.cal-nav button{padding:6px 12px;border-radius:6px;font-size:12px;font-weight:700;border:1px solid var(--border)}
.cal-nav button:hover{background:rgba(255,255,255,.06)}
.cal-nav .today-btn{background:var(--gold);color:var(--pd);border-color:var(--gold)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day{
  min-height:60px;padding:6px;border-radius:6px;background:rgba(255,255,255,.03);
  border:1px solid transparent;cursor:pointer;text-align:center;font-size:12px;
}
.cal-day:hover{border-color:var(--border)}
.cal-day.today{background:rgba(201,162,39,.12);border-color:var(--gold)}
.cal-day.has-appts{font-weight:800}
.cal-day .day-num{display:block;font-size:16px;font-weight:700;margin-bottom:2px}
.cal-day .day-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);margin:1px}
.cal-day-header{text-align:center;font-size:10px;text-transform:uppercase;color:var(--muted);padding:6px}

/* ── Roster ── */
.roster-row{
  display:grid;grid-template-columns:50px 1fr auto auto;gap:8px;align-items:center;
  padding:10px;border-radius:8px;margin-bottom:2px;cursor:pointer;font-size:13px;
}
.roster-row:hover{background:rgba(255,255,255,.04)}
.roster-room{font-weight:900;color:var(--gold)}
.roster-name{font-weight:700}.roster-spec{font-size:10px;color:var(--muted)}

/* ── Forms ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid .full{grid-column:1/-1}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.form-actions button{padding:10px 20px;border-radius:8px;font-weight:700;font-size:13px}
.btn-gold{background:var(--gold);color:var(--pd)}
.btn-outline{border:1px solid var(--border);background:rgba(255,255,255,.04)}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:4px 10px;font-size:11px;border-radius:6px;font-weight:700}

/* ── Empty state ── */
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}
.empty-icon{font-size:36px;margin-bottom:8px}

/* ── Weather ── */
.weather-card{display:flex;align-items:center;gap:12px}
.weather-icon{font-size:40px}.weather-temp{font-size:28px;font-weight:900}.weather-detail{font-size:11px;color:var(--muted)}

/* ── Modal ── */
.modal-overlay{
  display:none;position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.7);align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.open{display:flex}
.modal{
  width:min(800px,100%);max-height:90vh;overflow:auto;
  background:var(--pd);border:1px solid var(--border);border-radius:14px;
  padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.modal h2{margin-bottom:14px;color:var(--gold)}

/* ── Quick actions ── */
.quick-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.quick-bar button{
  padding:8px 16px;border-radius:8px;font-size:12px;font-weight:700;
  border:1px solid var(--border);transition:.15s;
}
.quick-bar button:hover{background:rgba(255,255,255,.06)}
.quick-bar button.primary{background:var(--gold);color:var(--pd);border-color:var(--gold)}

/* ── Settings ── */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.settings-grid{grid-template-columns:1fr}}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
.list-item button{font-size:10px;padding:3px 8px;border-radius:4px}

/* ── Print ── */
@media print{
  .topbar,.tab-bar,.tab-bar button:not(.active),.quick-bar,.modal-overlay,.btn-sm,.no-print{display:none!important}
  body{background:#fff;color:#000}
  .card{background:#fff;border:1px solid #ccc;box-shadow:none}
  .stat-card b,.appt-time{color:#000}
}
</style>
</head>
<body>

<!-- ── Header ── -->
<header class="topbar">
  <div class="brand">
    <span>⚕</span>
    <div><strong>CLC COMMAND CENTER</strong><small>Community Living Center · VA</small></div>
  </div>
  <span class="phi-badge">🔒 PHI — KEEP CONFIDENTIAL</span>
  <div style="display:flex;align-items:center;gap:8px;font-size:12px">
    <span id="greeting">Good morning</span>
    <span id="liveClock">--:--</span>
    <button class="btn-sm btn-outline" onclick="doLock()">🔓 Lock</button>
  </div>
</header>

<!-- ── Tab navigation ── -->
<nav class="tab-bar" id="tabBar">
  <button class="active" data-tab="home">🏠 Home</button>
  <button data-tab="appointments">📅 Appointments</button>
  <button data-tab="veterans">👥 Veterans</button>
  <button data-tab="transport">🚐 Transport</button>
  <button data-tab="reports">📋 Reports</button>
  <button data-tab="settings">⚙️ Settings</button>
</nav>

<!-- ── Workspace ── -->
<main class="workspace" id="workspace">
</main>

<!-- ── Modal ── -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<script src="clc-data.js"></script>
<script src="master-lists.js"></script>
<script>
/* ══════════════════════════════════════════════════════
   CLC Command Center — Unified App Shell
   ══════════════════════════════════════════════════════ */
var $=id=>document.getElementById(id);
var $$=sel=>[...document.querySelectorAll(sel)];
var esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
var iso=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
var today=iso();
var activeTab='home';

/* ── Auth ── */
var PASSCODE='CLC-Admin-2024';
function checkAuth(){
  if(sessionStorage.getItem('clc_auth')==='1')return true;
  var p=prompt('Enter access password:');
  if(p===PASSCODE){sessionStorage.setItem('clc_auth','1');return true}
  if(p)alert('Incorrect password.');
  return false;
}
function doLock(){sessionStorage.removeItem('clc_auth');location.reload()}

/* ── Tab switching ── */
function switchTab(tab){
  activeTab=tab;
  $$('#tabBar button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  render();
}
$$('#tabBar button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));

/* ── Greeting ── */
function updateGreeting(){
  var d=new Date(),h=d.getHours(),p=h<12?'morning':h<17?'afternoon':'evening';
  var msgs={morning:'☀️ Good morning',afternoon:'🌤️ Good afternoon',evening:'🌙 Good evening'};
  $('greeting').textContent=msgs[p];
  $('liveClock').textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
}
setInterval(updateGreeting,30000);updateGreeting();

/* ── Helpers ── */
function residents(){return window.CLCData?CLCData.residents(true):[]}
function apps(d){return window.CLCData?CLCData.appointmentsForDate(d||today):[]}
function allApps(){return window.CLCData?CLCData.appointments():[]}

function residentName(a){
  if(a.residentName)return a.residentName;
  var r=CLCData.resident(a.residentId);return r?r.name:'Unknown';
}

/* ── ==================== HOME TAB ==================== ── */
function renderHome(){
  var r=residents(),a=apps(),all=allApps();
  var pending=a.filter(x=>!x.completed&&!x.notCompleted);
  var departing=a.filter(x=>x.departed&&!x.completed);
  var census={LTC:0,SSR:0,EOL:0,Respite:0};
  r.forEach(x=>{var s=String(x.specialty||'LTC').toUpperCase();if(s==='SSR')census.SSR++;else if(s==='EOL')census.EOL++;else if(s==='RESP'||s==='RESPITE')census.Respite++;else census.LTC++});
  
  // Alerts
  var alerts=CLCData.alerts?CLCData.alerts():[];
  
  // Nursing facts
  var facts=[
    'More than 60% of the healthcare workforce in VA facilities are nurses or nursing support staff.',
    'The VA is the largest employer of nurses in the United States.',
    'VA nurses pioneered telehealth programs that now serve rural veterans nationwide.',
    'The first VA nursing school opened in 1923 — before many civilian nursing programs existed.',
    'CLC nurses provide 24/7 skilled care to veterans with complex medical needs.',
    'VA nursing documentation standards influenced nationwide EHR adoption.'
  ];
  var fact=facts[new Date().getDate()%facts.length];
  
  var h='';
  
  // Stat cards
  h+='<div class="stat-grid">';
  h+='<div class="stat-card"><b>'+a.length+'</b><span>Today\'s Appointments</span></div>';
  h+='<div class="stat-card"><b>'+all.length+'</b><span>Total Appointments</span></div>';
  h+='<div class="stat-card"><b>'+r.length+'</b><span>Veterans on Roster</span></div>';
  h+='<div class="stat-card"><b>'+pending.length+'</b><span>Pending Transport</span></div>';
  h+='<div class="stat-card '+((departing.length>0)?'warn':'')+'"><b>'+departing.length+'</b><span>Active Travel</span></div>';
  h+='</div>';
  
  // Two-column layout
  h+='<div class="grid-2">';
  
  // Left: Today's schedule + alerts
  h+='<div>';
  h+='<div class="card"><div class="card-header"><h2>📋 Today\'s Schedule</h2><span>'+iso()+'</span></div>';
  if(a.length===0){
    h+='<div class="empty"><div class="empty-icon">📅</div>No appointments scheduled for today.<br><button class="btn-sm btn-gold" style="margin-top:8px" onclick="switchTab(\'appointments\')">+ Add Appointment</button></div>';
  } else {
    a.forEach(x=>{
      var st=x.completed?'complete':x.departed?'departed':x.confirmed?'confirmed':'pending';
      var stLabel=x.completed?'Returned':x.departed?'Departed':x.confirmed?'Confirmed':'Pending';
      h+='<div class="appt-row" onclick="editAppointment(\''+esc(x.id)+'\')">';
      h+='<span class="appt-time">'+(x.leaveTime||x.time||'TBD')+'</span>';
      h+='<span><span class="appt-name">'+esc(residentName(x))+'</span><br><span class="appt-detail">'+esc(x.location||x.clinic||'')+' · '+esc(x.transportation||'')+'</span></span>';
      h+='<span class="appt-status status-'+st+'">'+stLabel+'</span>';
      h+='</div>';
    });
  }
  h+='</div></div>';
  
  // Alerts
  h+='<div class="card"><div class="card-header"><h2>⚠️ Needs Attention</h2><span>'+alerts.length+' open</span></div>';
  if(alerts.length===0){
    h+='<div class="empty">🟢 All clear. Nothing needs attention.</div>';
  } else {
    alerts.forEach(al=>{
      h+='<div class="alert-item '+(al.level==='red'?'crit':'warn')+'" onclick="if(al.id)editAppointment(\''+esc(al.id||'')+'\')">';
      h+='<span class="alert-dot"></span><span><strong>'+esc(al.title)+'</strong><br><small>'+esc(al.detail)+'</small></span>';
      h+='<span style="font-size:10px;color:var(--muted)">'+(al.id?'→':'')+'</span></div>';
    });
  }
  h+='</div></div>';
  
  // Right column
  h+='<div>';
  
  // Census
  h+='<div class="card"><div class="card-header"><h2>📊 Census</h2></div>';
  h+='<div class="stat-grid" style="grid-template-columns:1fr 1fr">';
  h+='<div class="stat-card"><b>'+census.LTC+'</b><span>LTC</span></div>';
  h+='<div class="stat-card"><b>'+census.SSR+'</b><span>SSR</span></div>';
  h+='<div class="stat-card"><b>'+census.EOL+'</b><span>EOL</span></div>';
  h+='<div class="stat-card"><b>'+census.Respite+'</b><span>Respite</span></div>';
  h+='</div></div>';
  
  // Quick roster
  h+='<div class="card"><div class="card-header"><h2>👥 Veteran Roster</h2><button class="btn-sm btn-outline" onclick="switchTab(\'veterans\')">View All</button></div>';
  if(r.length===0){
    h+='<div class="empty">No veterans on roster.</div>';
  } else {
    r.slice(0,5).forEach(x=>{
      h+='<div class="roster-row" onclick="switchTab(\'veterans\')"><span class="roster-room">'+esc(x.room||'—')+'</span><span><span class="roster-name">'+esc(x.name)+'</span><br><span class="roster-spec">'+esc(x.specialty||'')+' · '+esc(x.provider||'No provider')+'</span></span><span style="font-size:10px;color:var(--muted)">Shower: '+esc((x.bathDays||[]).join(',')||'—')+'</span></div>';
    });
  }
  h+='</div></div>';
  
  // Nursing fact
  h+='<div class="card"><div class="card-header"><h2>💡 Nursing Fact</h2></div>';
  h+='<p style="font-size:13px;line-height:1.5">'+fact+'</p></div>';
  
  h+='</div></div>'; // end two-column
  
  return h;
}

/* ── ==================== APPOINTMENTS TAB ==================== ── */
var calDate=new Date();var calView='day';

function renderAppointments(){
  var d=iso(calDate);
  var appsForDay=apps(d);
  var all=allApps();
  var h='';
  
  // Quick actions
  h+='<div class="quick-bar">';
  h+='<button class="primary" onclick="openAppointmentEditor()">＋ Add Appointment</button>';
  h+='<button onclick="printView()">🖨 Print</button>';
  h+='</div>';
  
  // Calendar nav
  var months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  h+='<div class="cal-nav">';
  h+='<div style="display:flex;gap:4px;align-items:center">';
  h+='<button onclick="calDate.setDate(calDate.getDate()-1);render()">◀</button>';
  h+='<button class="today-btn" onclick="calDate=new Date();render()">Today</button>';
  h+='<button onclick="calDate.setDate(calDate.getDate()+1);render()">▶</button>';
  h+='</div>';
  h+='<strong style="font-size:16px;color:var(--gold)">'+months[calDate.getMonth()]+' '+calDate.getDate()+', '+calDate.getFullYear()+'</strong>';
  h+='<div style="display:flex;gap:4px">';
  h+='<button class="'+(calView==='day'?'today-btn':'')+'" onclick="calView=\'day\';render()">Day</button>';
  h+='<button class="'+(calView==='week'?'today-btn':'')+'" onclick="calView=\'week\';render()">Week</button>';
  h+='</div></div>';
  
  // Appointments list
  h+='<div class="card"><div class="card-header"><h2>📅 Appointments</h2><span>'+appsForDay.length+' on this day</span></div>';
  if(appsForDay.length===0){
    h+='<div class="empty"><div class="empty-icon">📅</div>No appointments for this day.</div>';
  } else {
    appsForDay.forEach(x=>{
      var st=x.completed?'returned':x.departed?'departed':x.confirmed?'confirmed':x.transportStatus||'pending';
      var stLabel=x.completed?'Returned':x.departed?'Departed':x.confirmed?'Confirmed':(x.transportStatus||'Pending');
      h+='<div class="appt-row" onclick="openAppointmentEditor(\''+esc(x.id)+'\')">';
      h+='<span class="appt-time">'+(x.leaveTime||x.time||'TBD')+'</span>';
      h+='<span><span class="appt-name">'+esc(residentName(x))+'</span><br><span class="appt-detail">'+esc(x.reason||x.appointmentType||'')+' · '+esc(x.provider||x.doctorNP||'')+' · '+esc(x.location||'')+'</span></span>';
      h+='<span class="appt-status status-'+st+'">'+stLabel+'</span>';
      h+='</div>';
    });
  }
  h+='</div>';
  
  return h;
}

/* ── Appointment Editor Modal ── */
function openAppointmentEditor(id){
  var a=id?CLCData.appointments().find(x=>x.id===id):{id:'',date:iso(),time:'',leaveTime:'',returnTime:'',residentId:'',location:'',clinic:'',provider:'',escort:'',transportation:'',reason:'',transportStatus:'',escortName:'',prepInstructions:'',notes:'',changed:false,changeReason:''};
  var r=residents();
  var h='';
  
  // Match original CLC Scheduler modal structure exactly
  h+='<input type="hidden" id="m-id" value="'+esc(a.id||'')+'">';

/* ── Auto-fill helpers ── */
function vetAutoFill(){
  var sel=document.getElementById('m-vet');if(!sel)return;
  var opt=sel.options[sel.selectedIndex];if(!opt)return;
  var box=document.getElementById('m-standing-notes-box');
  var txt=document.getElementById('m-standing-notes-text');
  var name=sel.value;var r=residents().find(function(x){return x.name===name;});
  if(r&&r.notes){if(box&&txt){txt.textContent=r.notes;box.style.display='block'}}
  else{if(box)box.style.display='none'}
}

function providerAutoFill(){
  var name=document.getElementById('m-doctor')?.value;if(!name||!ChargeNurseLists)return;
  var p=ChargeNurseLists.providerProfile(name);
  if(p.facility){var loc=document.getElementById('m-loc');if(loc)loc.value=p.facility}
  if(p.clinic){var spec=document.getElementById('m-spec');if(spec)spec.value=p.clinic}
  if(p.phone){var phone=document.getElementById('m-phone');if(phone)phone.value=p.phone}
}

function locationAutoFill(){
  var name=document.getElementById('m-loc')?.value;if(!name||!ChargeNurseLists)return;
  var p=ChargeNurseLists.facilityProfile(name);
  if(p.phone){var ph=document.getElementById('m-phone');if(ph&&!ph.value)ph.value=p.phone}
  if(p.address){var c=document.getElementById('m-city');if(c&&!c.value)c.value=p.address}
}

function toggleChange(){
  var box=document.getElementById('change-box');if(box)box.style.display=document.getElementById('m-changed')?.checked?'block':'none';
}

function saveAppointment(id){
  var vet=document.getElementById('m-vet')?.value?.trim();
  var date=document.getElementById('m-date')?.value;
  if(!vet){alert('Veteran name is required.');return}
  if(!date){alert('Date is required.');return}
  var sel=document.getElementById('m-vet');var opt=sel?.options[sel.selectedIndex];
  var residentId=opt?.dataset?.id||'';
  var a={
    id:id||CLCData.uid(),residentId:residentId,date:date,
    time:document.getElementById('m-time')?.value||'',
    leaveTime:document.getElementById('m-leave')?.value||'',
    returnTime:document.getElementById('m-return-time')?.value||'',
    reason:document.getElementById('m-type')?.value||'',
    provider:document.getElementById('m-doctor')?.value||'',
    clinic:document.getElementById('m-spec')?.value||'',
    location:document.getElementById('m-loc')?.value||'',
    cityTown:document.getElementById('m-city')?.value||'',
    phone:document.getElementById('m-phone')?.value||'',
    transportation:document.getElementById('m-transport')?.value||'',
    transportStatus:document.getElementById('m-transport-status')?.value||'',
    escort:document.getElementById('m-escort')?.value||'',
    prepInstructions:document.getElementById('m-prep')?.value||'',
    notes:document.getElementById('m-notes')?.value||'',
    changed:document.getElementById('m-changed')?.checked||false,
    changeReason:document.getElementById('m-changereason')?.value||'',
    transportNeeded:!!(document.getElementById('m-transport')?.value),
    completed:document.getElementById('m-transport-status')?.value==='returned',
    departed:document.getElementById('m-transport-status')?.value==='departed',
    confirmed:document.getElementById('m-transport-status')?.value==='confirmed'
  };
  var r=CLCData.resident(a.residentId);
  if(r){a.residentName=r.name;a.room=r.room}
  CLCData.upsertAppointment(a);
  closeModal();render();
}

function deleteAppointment(id){
  if(!confirm('Delete this appointment?'))return;
  CLCData.removeAppointment(id);
  closeModal();render();
}

  h+='<div style="display:flex;gap:8px"><button class="btn-gold btn-sm" onclick="backupData()">Backup</button><button class="btn-outline btn-sm" onclick="document.getElementById(\'restoreFile\').click()">Restore</button><input type="file" id="restoreFile" accept=".json" hidden onchange="restoreData(event)"></div></div>';
  
  h+='</div>';
  return h;
}

function editListItem(cat,name){
  var val=prompt('Edit '+cat.slice(0,-1)+':',name);
  if(val&&val.trim()&&val!==name)ChargeNurseLists.update(cat,name,val.trim());
  render();
}
function addListItem(cat){
  var el=$('new'+cat.charAt(0).toUpperCase()+cat.slice(1));
  if(el&&el.value.trim()){ChargeNurseLists.add(cat,el.value.trim());el.value=''}
  render();
}
function backupData(){
  var pkg={clcData:CLCData.load(),masterLists:ChargeNurseLists.load(),exported:new Date().toISOString()};
  var blob=new Blob([JSON.stringify(pkg)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='CLC-Backup-'+iso()+'.json';a.click();
}
function restoreData(e){
  var f=e.target.files[0];if(!f)return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var p=JSON.parse(reader.result);
      if(p.clcData)CLCData.save(p.clcData);
      if(p.masterLists)ChargeNurseLists.save(p.masterLists);
      alert('Data restored. Reloading...');
      render();
    }catch(err){alert('Invalid backup file.')}
    e.target.value='';
  };
  reader.readAsText(f);
}

/* ── ==================== RENDER ==================== ── */
function render(){
  if(!checkAuth()){location.reload();return}
  updateGreeting();
  var html='';
  switch(activeTab){
    case 'home': html=renderHome(); break;
    case 'appointments': html=renderAppointments(); break;
    case 'veterans': html=renderVeterans(); break;
    case 'transport': html=renderTransport(); break;
    case 'reports': html=renderReports(); break;
    case 'settings': html=renderSettings(); break;
    default: html='<div class="card"><div class="empty"><div class="empty-icon">🚧</div>Coming soon.</div></div>';
  }
  $('workspace').innerHTML=html;
}

/* ── Modal ── */
function showModal(html){$('modalContent').innerHTML=html;$('modalOverlay').classList.add('open')}
function closeModal(){$('modalOverlay').classList.remove('open')}

/* ── Appointments (shared) ── */
function editAppointment(id){
  var a=CLCData.appointments().find(x=>x.id===id);
  if(!a)return;
  // Placeholder — full editor coming in Appointments tab
  alert('Edit: '+residentName(a)+' on '+a.date);
}

/* ── Init ── */
render();
window.addEventListener('clc:datachange',render);
</script>
