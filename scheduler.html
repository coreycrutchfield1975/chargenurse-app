<head>

<style>
:root{--ink:#17222b;--muted:#69767e;--canvas:#e7eeeb;--surface:#fffdf9;--line:#d5ded9;--nav:#152a38;--teal:#2f7d78;--teal2:#235e5a;--amber:#b97a29;--red:#b43d46;--green:#3f7f5d;--shadow:0 16px 42px rgba(35,42,47,.11)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(rgba(231,238,235,.95),rgba(231,238,235,.98)),radial-gradient(circle at 82% 0,rgba(47,125,120,.28),transparent 36%)}
.shell{max-width:1480px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);font-weight:900}.title{font-size:clamp(30px,4vw,46px);font-weight:930;letter-spacing:-.04em}.sub{color:var(--muted);margin-top:6px}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 13px;border-radius:12px;text-decoration:none;font-weight:820;cursor:pointer}.primary{background:var(--teal);border-color:var(--teal);color:#fff}.danger{background:var(--red);border-color:var(--red);color:#fff}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.metric{background:rgba(255,253,249,.93);border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:0 6px 20px rgba(35,42,47,.06)}.metric b{font-size:27px;display:block}.metric span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(330px,.65fr);gap:16px}.panel{background:rgba(255,253,249,.95);border:1px solid var(--line);border-top:5px solid var(--teal);border-radius:24px;box-shadow:var(--shadow);padding:18px}.section{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:900;color:#506069}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.calendar-title{font-size:23px;font-weight:900}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week div{text-align:center;font-size:10px;color:var(--muted);font-weight:900;text-transform:uppercase;padding:5px}.day{min-height:112px;border:1px solid #e0e5e1;border-radius:14px;background:#fbfcfa;padding:8px;cursor:pointer;overflow:hidden}.day:hover{border-color:var(--teal)}.day.out{opacity:.38}.day.today{box-shadow:inset 0 0 0 2px var(--teal)}.day.selected{background:#e5f0ed}.num{font-weight:900;font-size:12px}.event{margin-top:5px;padding:5px 6px;border-radius:8px;background:#dcecea;color:#285e59;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event.pending{background:#fff0dc;color:#84551d}.event.critical{background:#f7e2e4;color:#8b2932}
.agenda{max-height:650px;overflow:auto}.appt{padding:12px;border:1px solid #e3e5e0;border-radius:14px;margin-bottom:8px;background:#fbfaf6;cursor:pointer}.appt:hover{border-color:var(--teal)}.appt-top{display:flex;justify-content:space-between;gap:8px}.appt b{display:block}.small{font-size:11px;color:var(--muted)}.pill{display:inline-block;font-size:9px;padding:4px 7px;border-radius:999px;background:#e4efec;color:#2b615c;margin-top:6px}.pill.warn{background:#fff0dc;color:#84551d}.pill.done{background:#e5f1e8;color:#356747}
.modalbg{display:none;position:fixed;inset:0;background:rgba(13,24,29,.68);z-index:20;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(5px)}.modalbg.show{display:flex}.modal{width:min(900px,100%);max-height:94vh;overflow:auto;background:var(--surface);border-radius:23px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.3)}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field.span2{grid-column:span 2}.field label{font-size:11px;font-weight:850;color:#52616a}.field input,.field select,.field textarea{border:1px solid #cfd7d2;border-radius:10px;padding:10px;background:#fff}.checks{display:flex;gap:12px;flex-wrap:wrap;padding:8px 0}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.travel-box{border:1px solid #d7dfda;border-left:5px solid var(--amber);background:#fff9ef;border-radius:15px;padding:13px;margin:12px 0}
.travel-box h3{margin:0 0 5px;font-size:16px}.travel-box p{margin:4px 0;color:var(--muted);font-size:12px;line-height:1.45}
.email-preview{border:1px solid #d8ded9;background:#fff;border-radius:12px;padding:11px;white-space:pre-wrap;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;max-height:250px;overflow:auto}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#fff}
.viewbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 0 12px}
.viewbar .btn.active{background:var(--nav);border-color:var(--nav);color:#fff}
.calendar-body{min-height:520px}
.day-view{display:grid;gap:10px}.day-summary{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:15px;background:#f8faf8}.day-events{display:grid;gap:8px}
.day-event{display:grid;grid-template-columns:95px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px;border:1px solid #e0e5e1;border-radius:14px;background:#fbfcfa;cursor:pointer}.day-event:hover{border-color:var(--teal)}.day-time{font-weight:900;font-size:15px}.day-event .name{font-weight:850}
.week-view{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.week-day{min-height:430px;border:1px solid #dfe5e1;border-radius:14px;background:#fbfcfa;overflow:hidden}.week-day.selected{box-shadow:inset 0 0 0 2px var(--teal)}
.week-day-head{padding:9px;text-align:center;border-bottom:1px solid #e3e8e4;cursor:pointer}.week-day-head b{display:block;font-size:17px}.week-day-head span{font-size:10px;color:var(--muted);text-transform:uppercase}.week-events{padding:6px}
.week-event{padding:7px;border-radius:9px;background:#dcecea;color:#285e59;font-size:10px;margin-bottom:6px;cursor:pointer}.week-event.pending{background:#fff0dc;color:#84551d}.week-event.critical{background:#f7e2e4;color:#8b2932}
.year-view{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mini-month{border:1px solid #dfe5e1;border-radius:14px;padding:10px;background:#fbfcfa}.mini-title{text-align:center;font-weight:900;margin-bottom:7px;cursor:pointer}
.mini-week,.mini-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.mini-week span{text-align:center;font-size:8px;color:var(--muted);font-weight:800}.mini-day{min-height:26px;padding:3px;text-align:center;font-size:9px;border-radius:6px;cursor:pointer;position:relative}
.mini-day.out{opacity:.22}.mini-day.today{box-shadow:inset 0 0 0 1px var(--teal)}.mini-day.selected{background:#dcecea}.mini-day.has{font-weight:900}.mini-day.has:after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:var(--amber);bottom:2px;left:50%;transform:translateX(-50%)}

@media(max-width:1100px){.week-view{grid-template-columns:repeat(2,1fr)}.year-view{grid-template-columns:repeat(2,1fr)}}@media(max-width:950px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.shell{padding:14px}.top{flex-direction:column}.week,.days{gap:3px}.day{min-height:82px;padding:5px}.form{grid-template-columns:1fr}.field.full,.field.span2{grid-column:auto}.week-view,.year-view{grid-template-columns:1fr}.day-event{grid-template-columns:75px minmax(0,1fr)}.day-event .pill{grid-column:2}}
@media print{
.nav,.calendar-head .btn,.viewbar,.modalbg,.section .btn{display:none!important}
.shell{max-width:none;padding:0}.top{display:none}.metrics{display:grid;grid-template-columns:repeat(4,1fr);margin:0 0 10px}.metric{box-shadow:none;border:1px solid #777;padding:8px}.metric b{font-size:18px}
.grid{display:block}.panel{box-shadow:none;border:1px solid #555;margin-bottom:12px;border-radius:0;padding:10px}.calendar-title{font-size:17px}.day{min-height:72px;border-color:#999;border-radius:0;padding:4px}.event{white-space:normal;font-size:8px;padding:3px}.agenda{max-height:none;overflow:visible}.appt{border-color:#888;border-radius:0;padding:8px}.week div{color:#000}
}
</style><script src="appearance.js"></script>

<body data-print-title="Scheduler and Transportation" data-print-subtitle="Appointments, transportation, travel requests, departures, and returns"><div class="shell">
<header class="top"><div><div class="eyebrow">ChargeNurse · Scheduler Workspace</div><div class="title">Libertyville CLC Scheduler</div><div class="sub">Appointments, transportation and travel coordination—using the same Veteran records as Command Center.</div></div><div class="nav"><a class="btn" href="command-center.html">Command Center</a><a class="btn" href="operations-calendar.html">Operations Calendar</a><a class="btn" href="veterans.html">Veterans</a><button class="btn" onclick="window.print()">Print</button><button class="btn primary" onclick="openEditor()">New Appointment</button></div></header>
<div class="metrics" id="metrics"></div>
<div class="grid"><section class="panel"><div class="calendar-head"><button class="btn" onclick="moveView(-1)">Previous</button><div class="calendar-title" id="monthTitle"></div><div style="display:flex;gap:6px"><button class="btn" onclick="goToday()">Today</button><button class="btn" onclick="moveView(1)">Next</button></div></div><div class="viewbar"><button class="btn" data-calview="day" onclick="setCalendarView('day')">Day</button><button class="btn" data-calview="week" onclick="setCalendarView('week')">Week</button><button class="btn" data-calview="month" onclick="setCalendarView('month')">Month</button><button class="btn" data-calview="year" onclick="setCalendarView('year')">Year</button></div><div class="calendar-body" id="calendarBody"></div></section>
<aside class="panel"><div class="section"><span id="agendaTitle">Selected Day</span><button class="btn primary" onclick="openEditor(null,selectedDate)">Add</button></div><div class="agenda" id="agenda"></div></aside></div></div>
<div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div>
<script>
'use strict';
var cursor=new Date(),selectedDate=iso(new Date()),calendarView=localStorage.getItem('clc-scheduler-view')||'month';
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(x){return String(x||'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])})}
function status(a){if(a.completed)return['Completed','done'];if(a.notCompleted)return['Not completed','warn'];if(a.transportNeeded&&!a.travelRequestEmailed)return['Travel request pending','warn'];if(a.transportNeeded&&!a.ticketPrepared)return['Ticket pending','warn'];return['Scheduled','']}
function startOfWeek(d){var x=new Date(d);x.setDate(x.getDate()-x.getDay());x.setHours(12,0,0,0);return x}
function render(){
 var all=CLCData.appointments(),today=iso(new Date()),todayRows=all.filter(function(a){return a.date===today}),pending=all.filter(function(a){return a.date>=today&&a.transportNeeded&&!a.completed&&(!a.ticketPrepared||!a.travelRequestEmailed)}),completed=todayRows.filter(function(a){return a.completed});
 document.getElementById('metrics').innerHTML='<div class="metric"><b>'+todayRows.length+'</b><span>Appointments today</span></div><div class="metric"><b>'+pending.length+'</b><span>Travel items pending</span></div><div class="metric"><b>'+completed.length+'</b><span>Completed today</span></div><div class="metric"><b>'+CLCData.residents().length+'</b><span>Active Veterans</span></div>';
 document.querySelectorAll('[data-calview]').forEach(function(b){b.classList.toggle('active',b.dataset.calview===calendarView)});
 if(calendarView==='day')renderDay(all);else if(calendarView==='week')renderWeek(all);else if(calendarView==='year')renderYear(all);else renderMonth(all);
 renderAgenda();
}
function renderDay(all){
 var d=new Date(selectedDate+'T12:00:00'),rows=all.filter(function(a){return a.date===selectedDate}).sort(function(a,b){return(a.time||a.leaveTime||'').localeCompare(b.time||b.leaveTime||'')});cursor=new Date(d);
 monthTitle.textContent=d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric',year:'numeric'});
 calendarBody.innerHTML='<div class="day-view"><div class="day-summary"><div><b>'+rows.length+' appointment'+(rows.length===1?'':'s')+'</b><div class="small">'+rows.filter(function(a){return a.transportNeeded!==false}).length+' requiring transportation</div></div><button class="btn primary" onclick="openEditor(null,\''+selectedDate+'\')">Add Appointment</button></div><div class="day-events">'+(rows.length?rows.map(function(a){var st=status(a);return'<div class="day-event" onclick="openEditor(\''+esc(a.id)+'\')"><div class="day-time">'+esc(a.time||a.leaveTime||'Time not set')+'</div><div><span class="name">'+esc(a.residentName)+'</span><div class="small">Room '+esc(a.room||'—')+' · '+esc(a.location||a.clinic||'Location not entered')+'<br>'+esc(a.transportation||'Transportation not specified')+'</div></div><span class="pill '+st[1]+'">'+st[0]+'</span></div>'}).join(''):'<div class="small" style="padding:40px;text-align:center">No appointments scheduled for this day.</div>')+'</div></div>';
}
function renderWeek(all){
 var base=startOfWeek(new Date(selectedDate+'T12:00:00')),end=new Date(base);end.setDate(base.getDate()+6);cursor=new Date(base);
 monthTitle.textContent=base.toLocaleDateString([], {month:'short',day:'numeric'})+' – '+end.toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'});
 var html='<div class="week-view">';
 for(var i=0;i<7;i++){var d=new Date(base);d.setDate(base.getDate()+i);var ds=iso(d),rows=all.filter(function(a){return a.date===ds}).sort(function(a,b){return(a.time||'').localeCompare(b.time||'')});
 html+='<div class="week-day '+(ds===selectedDate?'selected':'')+'"><div class="week-day-head" onclick="selectDate(\''+ds+'\')"><span>'+d.toLocaleDateString([], {weekday:'short'})+'</span><b>'+d.getDate()+'</b></div><div class="week-events">'+(rows.length?rows.map(function(a){var st=status(a);return'<div class="week-event '+(st[1]==='warn'?'pending ':'')+(a.notCompleted?'critical':'')+'" onclick="event.stopPropagation();openEditor(\''+esc(a.id)+'\')">'+esc((a.time||a.leaveTime||'')+' '+a.residentName)+'</div>'}).join(''):'<div class="small" style="padding:10px;text-align:center">No appointments</div>')+'</div></div>'}
 calendarBody.innerHTML=html+'</div>';
}
function renderMonth(all){
 monthTitle.textContent=cursor.toLocaleDateString([], {month:'long',year:'numeric'});
 var y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),today=iso(new Date()),html='<div class="week"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div><div class="days">';
 for(var i=0;i<42;i++){var d=new Date(start);d.setDate(start.getDate()+i);var ds=iso(d),rows=all.filter(function(a){return a.date===ds});html+='<div class="day '+(d.getMonth()!==m?'out ':'')+(ds===today?'today ':'')+(ds===selectedDate?'selected':'')+'" onclick="selectDate(\''+ds+'\')"><div class="num">'+d.getDate()+'</div>'+rows.slice(0,3).map(function(a){var st=status(a);return'<div class="event '+(st[1]==='warn'?'pending ':'')+(a.notCompleted?'critical':'')+'" onclick="event.stopPropagation();openEditor(\''+esc(a.id)+'\')">'+esc((a.time||'')+' '+a.residentName)+'</div>'}).join('')+(rows.length>3?'<div class="small">+'+(rows.length-3)+' more</div>':'')+'</div>'}
 calendarBody.innerHTML=html+'</div>';
}
function renderYear(all){
 var year=cursor.getFullYear(),today=iso(new Date());monthTitle.textContent=String(year);var html='<div class="year-view">';
 for(var m=0;m<12;m++){var first=new Date(year,m,1),start=new Date(year,m,1-first.getDay());html+='<div class="mini-month"><div class="mini-title" onclick="openMonth('+m+')">'+first.toLocaleDateString([], {month:'long'})+'</div><div class="mini-week"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div><div class="mini-days">';
 for(var i=0;i<42;i++){var d=new Date(start);d.setDate(start.getDate()+i);var ds=iso(d),has=all.some(function(a){return a.date===ds});html+='<div class="mini-day '+(d.getMonth()!==m?'out ':'')+(ds===today?'today ':'')+(ds===selectedDate?'selected ':'')+(has?'has':'')+'" onclick="selectYearDate(\''+ds+'\')">'+d.getDate()+'</div>'}html+='</div></div>'}
 calendarBody.innerHTML=html+'</div>';
}
function renderAgenda(){var rows=CLCData.appointmentsForDate(selectedDate);agendaTitle.textContent=new Date(selectedDate+'T12:00:00').toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'});agenda.innerHTML=rows.length?rows.map(function(a){var st=status(a);return'<div class="appt" onclick="openEditor(\''+esc(a.id)+'\')"><div class="appt-top"><span><b>'+esc(a.time||a.leaveTime||'Time not set')+' · '+esc(a.residentName)+'</b><span class="small">Room '+esc(a.room||'—')+' · '+esc(a.location||'Location not entered')+'</span></span><span class="pill '+st[1]+'">'+st[0]+'</span></div><div class="small" style="margin-top:7px">'+esc(a.transportation||'Transportation not specified')+'</div></div>'}).join(''):'<div class="small" style="padding:30px;text-align:center">No appointments scheduled for this day.</div>'}
window.setCalendarView=function(v){calendarView=v;localStorage.setItem('clc-scheduler-view',v);render()}
window.moveView=function(n){if(calendarView==='day'){var d=new Date(selectedDate+'T12:00:00');d.setDate(d.getDate()+n);selectedDate=iso(d);cursor=new Date(d)}else if(calendarView==='week'){var w=new Date(selectedDate+'T12:00:00');w.setDate(w.getDate()+7*n);selectedDate=iso(w);cursor=new Date(w)}else if(calendarView==='year'){cursor=new Date(cursor.getFullYear()+n,0,1);selectedDate=iso(new Date(cursor.getFullYear(),0,1))}else{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+n,1);selectedDate=iso(new Date(cursor.getFullYear(),cursor.getMonth(),1))}render()}
window.goToday=function(){var d=new Date();selectedDate=iso(d);cursor=new Date(d);render()}
window.selectDate=function(v){selectedDate=v;cursor=new Date(v+'T12:00:00');render()}
window.selectYearDate=function(v){selectedDate=v;cursor=new Date(v+'T12:00:00');calendarView='day';localStorage.setItem('clc-scheduler-view','day');render()}
window.openMonth=function(m){cursor=new Date(cursor.getFullYear(),m,1);selectedDate=iso(cursor);calendarView='month';localStorage.setItem('clc-scheduler-view','month');render()}
window.closeEditor=function(){document.getElementById('modalbg').classList.remove('show')}
window.openEditor=function(id,date){
 var a=id?CLCData.appointments().find(function(x){return x.id===id}):null;a=a||CLCData.normalizeAppointment({date:date||selectedDate,transportNeeded:true});
 var residents=CLCData.residents();document.getElementById('modal').innerHTML='<h2>'+(id?'Edit':'New')+' Appointment</h2><div class="form"><div class="field span2"><label>Veteran</label><select id="fResident"><option value="">Select Veteran</option>'+residents.map(function(r){return '<option value="'+esc(r.id)+'" '+(r.id===a.residentId?'selected':'')+'>'+esc((r.room?('Room '+r.room+' · '):'')+r.name)+'</option>'}).join('')+'</select></div><div class="field"><label>Date</label><input type="date" id="fDate" value="'+esc(a.date)+'"></div><div class="field"><label>Appointment Time</label><input type="time" id="fTime" value="'+esc(a.time)+'"></div><div class="field"><label>Departure Time</label><input type="time" id="fLeave" value="'+esc(a.leaveTime)+'"></div><div class="field"><label>Location / Destination</label><input id="fLocation" value="'+esc(a.location)+'"></div><div class="field"><label>Clinic</label><input id="fClinic" value="'+esc(a.clinic)+'"></div><div class="field"><label>Provider</label><input id="fProvider" value="'+esc(a.provider)+'"></div><div class="field"><label>Escort</label><input id="fEscort" value="'+esc(a.escort)+'"></div><div class="field span2"><label>Transportation</label><input id="fTransport" value="'+esc(a.transportation)+'" placeholder="VA vehicle, wheelchair van, family..."></div><div class="field"><label>Transportation Email</label><input type="email" id="fEmailTo" value="'+esc(a.emailTo)+'" placeholder="Transportation department email"></div><div class="field full"><label>Travel Request Preparation / Reason</label><textarea id="fReason">'+esc(a.reason)+'</textarea></div><div class="field full"><label>Status</label><div class="checks"><label><input type="checkbox" id="fNeeded" '+(a.transportNeeded?'checked':'')+'> Transportation needed</label><label><input type="checkbox" id="fWheel" '+(a.wheelchair?'checked':'')+'> Wheelchair</label><label><input type="checkbox" id="fOxygen" '+(a.oxygen?'checked':'')+'> Oxygen</label><label><input type="checkbox" id="fTicket" '+(a.ticketPrepared?'checked':'')+'> Ticket to Ride</label><label><input type="checkbox" id="fTravel" '+(a.travelRequestEmailed?'checked':'')+'> Travel Request sent</label><label><input type="checkbox" id="fConfirmed" '+(a.confirmed?'checked':'')+'> Confirmed</label><label><input type="checkbox" id="fDeparted" '+(a.departed?'checked':'')+'> Departed</label><label><input type="checkbox" id="fCompleted" '+(a.completed?'checked':'')+'> Returned / completed</label><label><input type="checkbox" id="fNotCompleted" '+(a.notCompleted?'checked':'')+'> Not completed</label><label><input type="checkbox" id="fChart" '+(a.chartFlagged?'checked':'')+'> Chart flagged</label></div></div><div class="field"><label>Return Time</label><input type="time" id="fReturn" value="'+esc(a.returnTime)+'"></div><div class="field full"><label>Notes</label><textarea id="fNotes">'+esc(a.notes)+'</textarea></div></div><div class="actions">'+(id?'<button class="btn danger" onclick="removeAppointment(\''+esc(id)+'\')">Delete</button>':'')+'<button class="btn" onclick="closeEditor()">Cancel</button><button class="btn primary" onclick="beginSaveAppointment(\''+esc(a.id)+'\')">Save Appointment</button></div>';
 document.getElementById('modalbg').classList.add('show')
}
function collectAppointment(id){
 return {id:id,residentId:fResident.value,date:fDate.value,time:fTime.value,leaveTime:fLeave.value,location:fLocation.value.trim(),clinic:fClinic.value.trim(),provider:fProvider.value.trim(),escort:fEscort.value.trim(),transportation:fTransport.value.trim(),emailTo:fEmailTo.value.trim(),reason:fReason.value.trim(),wheelchair:fWheel.checked,oxygen:fOxygen.checked,transportNeeded:fNeeded.checked,ticketPrepared:fTicket.checked,travelRequestEmailed:fTravel.checked,confirmed:fConfirmed.checked,departed:fDeparted.checked,completed:fCompleted.checked,notCompleted:fNotCompleted.checked,chartFlagged:fChart.checked,returnTime:fReturn.value,notes:fNotes.value.trim()}
}
function appointmentVeteranName(a){
 var r=CLCData.resident(a.residentId);return r?r.name:'Veteran'
}
function travelEmailSubject(a){return 'Travel Request - '+appointmentVeteranName(a)+' - '+a.date}
function travelEmailBody(a){
 var r=CLCData.resident(a.residentId)||{};
 return [
  'Travel Request',
  '',
  'Veteran: '+(r.name||''),
  'Room: '+(r.room||''),
  'Appointment Date: '+a.date,
  'Appointment Time: '+(a.time||'Not entered'),
  'Requested Departure Time: '+(a.leaveTime||'Not entered'),
  'Destination / Location: '+(a.location||'Not entered'),
  'Clinic: '+(a.clinic||'Not entered'),
  'Provider: '+(a.provider||'Not entered'),
  'Transportation: '+(a.transportation||'Not entered'),
  'Escort: '+(a.escort||'None entered'),
  'Wheelchair: '+(a.wheelchair?'Yes':'No'),
  'Oxygen: '+(a.oxygen?'Yes':'No'),
  '',
  'Preparation / Reason:',
  a.reason||'None entered'
 ].join('\n')
}
window.beginSaveAppointment=function(id){
 if(!fResident.value){alert('Select a Veteran.');return}
 var a=collectAppointment(id);
 if(!a.date){alert('Enter the appointment date.');return}
 if(a.transportNeeded&&!a.travelRequestEmailed){openTravelRequestGate(a);return}
 saveAppointmentRecord(a)
}
function openTravelRequestGate(a){
 var recipient=a.emailTo||localStorage.getItem('clc-transport-email')||'';
 var subject=travelEmailSubject(a),body=travelEmailBody(a);
 document.getElementById('modal').innerHTML='<h2>Travel Request Required</h2><div class="travel-box"><h3>Transportation is marked as needed.</h3><p>The Travel Request email must open before this appointment can be saved. Cancel below when this appointment does not require transportation.</p></div><div class="form"><div class="field full"><label>Transportation Email</label><input type="email" id="travelRecipient" value="'+esc(recipient)+'" placeholder="Transportation department email"></div><div class="field full"><label>Email Preview</label><div class="email-preview">'+esc('Subject: '+subject+'\n\n'+body)+'</div></div></div><div class="actions"><button class="btn" onclick="returnToAppointment()">Back</button><button class="btn" onclick="saveWithoutTransportation()">No Transportation Needed</button><button class="btn amber" onclick="openTravelEmail()">Open Travel Request Email</button></div><div class="actions"><button class="btn primary" id="confirmTravelSave" onclick="confirmTravelRequestAndSave()" disabled>Confirm Request Opened/Sent and Save</button></div>';
 window.pendingAppointment=a;window.pendingTravelSubject=subject;window.pendingTravelBody=body
}
window.returnToAppointment=function(){
 var a=window.pendingAppointment;if(!a)return;
 openEditor(a.id||null,a.date);
 setTimeout(function(){
  fResident.value=a.residentId;fDate.value=a.date;fTime.value=a.time;fLeave.value=a.leaveTime;fLocation.value=a.location;fClinic.value=a.clinic;fProvider.value=a.provider;fEscort.value=a.escort;fTransport.value=a.transportation;fEmailTo.value=a.emailTo;fReason.value=a.reason;fWheel.checked=a.wheelchair;fOxygen.checked=a.oxygen;fNeeded.checked=a.transportNeeded;fTicket.checked=a.ticketPrepared;fTravel.checked=a.travelRequestEmailed;fConfirmed.checked=a.confirmed;fDeparted.checked=a.departed;fCompleted.checked=a.completed;fNotCompleted.checked=a.notCompleted;fChart.checked=a.chartFlagged;fReturn.value=a.returnTime;fNotes.value=a.notes
 },0)
}
window.openTravelEmail=function(){
 var recipient=document.getElementById('travelRecipient').value.trim();
 if(!recipient){alert('Enter the transportation email address.');return}
 localStorage.setItem('clc-transport-email',recipient);
 window.pendingAppointment.emailTo=recipient;
 var href='mailto:'+encodeURIComponent(recipient)+'?subject='+encodeURIComponent(window.pendingTravelSubject)+'&body='+encodeURIComponent(window.pendingTravelBody);
 window.location.href=href;
 document.getElementById('confirmTravelSave').disabled=false
}
window.confirmTravelRequestAndSave=function(){
 var a=window.pendingAppointment;if(!a)return;
 a.emailTo=document.getElementById('travelRecipient').value.trim();
 a.travelRequestEmailed=true;
 a.emailDate=new Date().toISOString().slice(0,16);
 saveAppointmentRecord(a)
}
window.saveWithoutTransportation=function(){
 var a=window.pendingAppointment;if(!a)return;
 if(!confirm('Save this appointment as not requiring transportation?'))return;
 a.transportNeeded=false;a.travelRequestEmailed=false;a.confirmed=false;
 saveAppointmentRecord(a)
}
function saveAppointmentRecord(a){
 CLCData.upsertAppointment(a);selectedDate=a.date;cursor=new Date(a.date+'T12:00:00');
 window.pendingAppointment=null;closeEditor();render()
}
window.removeAppointment=function(id){if(confirm('Delete this appointment?')){CLCData.removeAppointment(id);closeEditor();render()}}
window.addEventListener('clc:datachange',render);
(function openDeepLink(){
  var params=new URLSearchParams(location.search),id=params.get('appointment'),date=params.get('date');
  if(date){selectedDate=date;cursor=new Date(date+'T12:00:00')}
  render();
  if(id){
    var found=CLCData.appointments().find(function(a){return a.id===id});
    if(found){selectedDate=found.date;cursor=new Date(found.date+'T12:00:00');render();openEditor(id)}
  }
})();
</script><script src="print-support.js"></script>
</body></html>
