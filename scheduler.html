<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Libertyville CLC Scheduler</title>
<script src="auth-session.js"></script>
<script>if(!window.CLCAuth||!CLCAuth.requireAuth())throw new Error('Authentication required');</script>
<script src="clc-data.js"></script>
<style>
:root{--ink:#17222b;--muted:#69767e;--canvas:#e7eeeb;--surface:#fffdf9;--line:#d5ded9;--nav:#152a38;--teal:#2f7d78;--teal2:#235e5a;--amber:#b97a29;--red:#b43d46;--green:#3f7f5d;--shadow:0 16px 42px rgba(35,42,47,.11)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(rgba(231,238,235,.95),rgba(231,238,235,.98)),radial-gradient(circle at 82% 0,rgba(47,125,120,.28),transparent 36%)}
.shell{max-width:1480px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);font-weight:900}.title{font-size:clamp(30px,4vw,46px);font-weight:930;letter-spacing:-.04em}.sub{color:var(--muted);margin-top:6px}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 13px;border-radius:12px;text-decoration:none;font-weight:820;cursor:pointer}.primary{background:var(--teal);border-color:var(--teal);color:#fff}.danger{background:var(--red);border-color:var(--red);color:#fff}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.metric{background:rgba(255,253,249,.93);border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:0 6px 20px rgba(35,42,47,.06)}.metric b{font-size:27px;display:block}.metric span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(330px,.65fr);gap:16px}.panel{background:rgba(255,253,249,.95);border:1px solid var(--line);border-top:5px solid var(--teal);border-radius:24px;box-shadow:var(--shadow);padding:18px}.section{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:900;color:#506069}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.calendar-title{font-size:23px;font-weight:900}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week div{text-align:center;font-size:10px;color:var(--muted);font-weight:900;text-transform:uppercase;padding:5px}.day{min-height:112px;border:1px solid #e0e5e1;border-radius:14px;background:#fbfcfa;padding:8px;cursor:pointer;overflow:hidden}.day:hover{border-color:var(--teal)}.day.out{opacity:.38}.day.today{box-shadow:inset 0 0 0 2px var(--teal)}.day.selected{background:#e5f0ed}.num{font-weight:900;font-size:12px}.event{margin-top:5px;padding:5px 6px;border-radius:8px;background:#dcecea;color:#285e59;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event.pending{background:#fff0dc;color:#84551d}.event.critical{background:#f7e2e4;color:#8b2932}
.agenda{max-height:650px;overflow:auto}.appt{padding:12px;border:1px solid #e3e5e0;border-radius:14px;margin-bottom:8px;background:#fbfaf6;cursor:pointer}.appt:hover{border-color:var(--teal)}.appt-top{display:flex;justify-content:space-between;gap:8px}.appt b{display:block}.small{font-size:11px;color:var(--muted)}.pill{display:inline-block;font-size:9px;padding:4px 7px;border-radius:999px;background:#e4efec;color:#2b615c;margin-top:6px}.pill.warn{background:#fff0dc;color:#84551d}.pill.done{background:#e5f1e8;color:#356747}
.modalbg{display:none;position:fixed;inset:0;background:rgba(13,24,29,.68);z-index:20;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(5px)}.modalbg.show{display:flex}.modal{width:min(900px,100%);max-height:94vh;overflow:auto;background:var(--surface);border-radius:23px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.3)}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field.span2{grid-column:span 2}.field label{font-size:11px;font-weight:850;color:#52616a}.field input,.field select,.field textarea{border:1px solid #cfd7d2;border-radius:10px;padding:10px;background:#fff}.checks{display:flex;gap:12px;flex-wrap:wrap;padding:8px 0}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
@media(max-width:950px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.shell{padding:14px}.top{flex-direction:column}.week,.days{gap:3px}.day{min-height:82px;padding:5px}.form{grid-template-columns:1fr}.field.full,.field.span2{grid-column:auto}}
@media print{.nav,.metrics,.calendar-head .btn,.modalbg{display:none!important}.grid{display:block}.panel{box-shadow:none;border:1px solid #333;margin-bottom:12px}}
</style></head>
<body><div class="shell">
<header class="top"><div><div class="eyebrow">ChargeNurse · Scheduler Workspace</div><div class="title">Libertyville CLC Scheduler</div><div class="sub">Appointments, transportation and travel coordination—using the same Veteran records as Command Center.</div></div><div class="nav"><a class="btn" href="command-center.html">Command Center</a><button class="btn" onclick="window.print()">Print</button><button class="btn primary" onclick="openEditor()">New Appointment</button></div></header>
<div class="metrics" id="metrics"></div>
<div class="grid"><section class="panel"><div class="calendar-head"><button class="btn" onclick="moveMonth(-1)">Previous</button><div class="calendar-title" id="monthTitle"></div><button class="btn" onclick="moveMonth(1)">Next</button></div><div class="week"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div><div class="days" id="days"></div></section>
<aside class="panel"><div class="section"><span id="agendaTitle">Selected Day</span><button class="btn primary" onclick="openEditor(null,selectedDate)">Add</button></div><div class="agenda" id="agenda"></div></aside></div></div>
<div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div>
<script>
'use strict';
var cursor=new Date(),selectedDate=iso(new Date());
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(x){return String(x||'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])})}
function status(a){if(a.completed)return['Completed','done'];if(a.notCompleted)return['Not completed','warn'];if(a.transportNeeded&&!a.travelRequestEmailed)return['Travel request pending','warn'];if(a.transportNeeded&&!a.ticketPrepared)return['Ticket pending','warn'];return['Scheduled','']}
function render(){
 var all=CLCData.appointments(),today=iso(new Date()),todayRows=all.filter(function(a){return a.date===today}),pending=all.filter(function(a){return a.date>=today&&a.transportNeeded&&!a.completed&&(!a.ticketPrepared||!a.travelRequestEmailed)}),completed=todayRows.filter(function(a){return a.completed});
 document.getElementById('metrics').innerHTML='<div class="metric"><b>'+todayRows.length+'</b><span>Appointments today</span></div><div class="metric"><b>'+pending.length+'</b><span>Travel items pending</span></div><div class="metric"><b>'+completed.length+'</b><span>Completed today</span></div><div class="metric"><b>'+CLCData.residents().length+'</b><span>Active Veterans</span></div>';
 document.getElementById('monthTitle').textContent=cursor.toLocaleDateString([], {month:'long',year:'numeric'});
 var y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),html='';
 for(var i=0;i<42;i++){var d=new Date(start);d.setDate(start.getDate()+i);var ds=iso(d),rows=all.filter(function(a){return a.date===ds});html+='<div class="day '+(d.getMonth()!==m?'out ':'')+(ds===today?'today ':'')+(ds===selectedDate?'selected':'')+'" onclick="selectDate(\''+ds+'\')"><div class="num">'+d.getDate()+'</div>'+rows.slice(0,3).map(function(a){var s=status(a);return '<div class="event '+(s[1]==='warn'?'pending ':'')+(a.notCompleted?'critical':'')+'">'+esc((a.time||'')+' '+a.residentName)+'</div>'}).join('')+(rows.length>3?'<div class="small">+'+(rows.length-3)+' more</div>':'')+'</div>'}
 document.getElementById('days').innerHTML=html;renderAgenda();
}
function renderAgenda(){var rows=CLCData.appointmentsForDate(selectedDate);document.getElementById('agendaTitle').textContent=new Date(selectedDate+'T12:00:00').toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'});document.getElementById('agenda').innerHTML=rows.length?rows.map(function(a){var s=status(a);return '<div class="appt" onclick="openEditor(\''+esc(a.id)+'\')"><div class="appt-top"><span><b>'+esc(a.time||a.leaveTime||'Time not set')+' · '+esc(a.residentName)+'</b><span class="small">Room '+esc(a.room||'—')+' · '+esc(a.location||'Location not entered')+'</span></span><span class="pill '+s[1]+'">'+s[0]+'</span></div><div class="small" style="margin-top:7px">'+esc(a.transportation||'Transportation not specified')+'</div></div>'}).join(''):'<div class="small" style="padding:30px;text-align:center">No appointments scheduled for this day.</div>'}
window.moveMonth=function(n){cursor=new Date(cursor.getFullYear(),cursor.getMonth()+n,1);render()}
window.selectDate=function(v){selectedDate=v;render()}
window.closeEditor=function(){document.getElementById('modalbg').classList.remove('show')}
window.openEditor=function(id,date){
 var a=id?CLCData.appointments().find(function(x){return x.id===id}):null;a=a||CLCData.normalizeAppointment({date:date||selectedDate,transportNeeded:true});
 var residents=CLCData.residents();document.getElementById('modal').innerHTML='<h2>'+(id?'Edit':'New')+' Appointment</h2><div class="form"><div class="field span2"><label>Veteran</label><select id="fResident"><option value="">Select Veteran</option>'+residents.map(function(r){return '<option value="'+esc(r.id)+'" '+(r.id===a.residentId?'selected':'')+'>'+esc((r.room?('Room '+r.room+' · '):'')+r.name)+'</option>'}).join('')+'</select></div><div class="field"><label>Date</label><input type="date" id="fDate" value="'+esc(a.date)+'"></div><div class="field"><label>Appointment Time</label><input type="time" id="fTime" value="'+esc(a.time)+'"></div><div class="field"><label>Departure Time</label><input type="time" id="fLeave" value="'+esc(a.leaveTime)+'"></div><div class="field"><label>Location / Destination</label><input id="fLocation" value="'+esc(a.location)+'"></div><div class="field"><label>Clinic</label><input id="fClinic" value="'+esc(a.clinic)+'"></div><div class="field"><label>Provider</label><input id="fProvider" value="'+esc(a.provider)+'"></div><div class="field"><label>Escort</label><input id="fEscort" value="'+esc(a.escort)+'"></div><div class="field span2"><label>Transportation</label><input id="fTransport" value="'+esc(a.transportation)+'" placeholder="VA vehicle, wheelchair van, family..."></div><div class="field full"><label>Status</label><div class="checks"><label><input type="checkbox" id="fNeeded" '+(a.transportNeeded?'checked':'')+'> Transportation needed</label><label><input type="checkbox" id="fTicket" '+(a.ticketPrepared?'checked':'')+'> Ticket to Ride</label><label><input type="checkbox" id="fTravel" '+(a.travelRequestEmailed?'checked':'')+'> Travel Request sent</label><label><input type="checkbox" id="fConfirmed" '+(a.confirmed?'checked':'')+'> Confirmed</label><label><input type="checkbox" id="fDeparted" '+(a.departed?'checked':'')+'> Departed</label><label><input type="checkbox" id="fCompleted" '+(a.completed?'checked':'')+'> Returned / completed</label><label><input type="checkbox" id="fNotCompleted" '+(a.notCompleted?'checked':'')+'> Not completed</label><label><input type="checkbox" id="fChart" '+(a.chartFlagged?'checked':'')+'> Chart flagged</label></div></div><div class="field"><label>Return Time</label><input type="time" id="fReturn" value="'+esc(a.returnTime)+'"></div><div class="field full"><label>Notes</label><textarea id="fNotes">'+esc(a.notes)+'</textarea></div></div><div class="actions">'+(id?'<button class="btn danger" onclick="removeAppointment(\''+esc(id)+'\')">Delete</button>':'')+'<button class="btn" onclick="closeEditor()">Cancel</button><button class="btn primary" onclick="saveAppointment(\''+esc(a.id)+'\')">Save Appointment</button></div>';
 document.getElementById('modalbg').classList.add('show')
}
window.saveAppointment=function(id){if(!fResident.value){alert('Select a Veteran.');return}var a={id:id,residentId:fResident.value,date:fDate.value,time:fTime.value,leaveTime:fLeave.value,location:fLocation.value.trim(),clinic:fClinic.value.trim(),provider:fProvider.value.trim(),escort:fEscort.value.trim(),transportation:fTransport.value.trim(),transportNeeded:fNeeded.checked,ticketPrepared:fTicket.checked,travelRequestEmailed:fTravel.checked,confirmed:fConfirmed.checked,departed:fDeparted.checked,completed:fCompleted.checked,notCompleted:fNotCompleted.checked,chartFlagged:fChart.checked,returnTime:fReturn.value,notes:fNotes.value.trim()};CLCData.upsertAppointment(a);selectedDate=a.date;cursor=new Date(a.date+'T12:00:00');closeEditor();render()}
window.removeAppointment=function(id){if(confirm('Delete this appointment?')){CLCData.removeAppointment(id);closeEditor();render()}}
window.addEventListener('clc:datachange',render);
(function openDeepLink(){
  var params=new URLSearchParams(location.search),id=params.get('appointment'),date=params.get('date');
  if(date){selectedDate=date;cursor=new Date(date+'T12:00:00')}
  render();
  if(id){
    var found=CLCData.appointments().find(function(a){return a.id===id});
    if(found){selectedDate=found.date;cursor=new Date(found.date+'T12:00:00');render();openEditor(id)}
  }
})();
</script></body></html>
