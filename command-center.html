<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLC Nursing Command Center</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef6ff;background:radial-gradient(circle at 16% 12%,rgba(77,160,255,.2),transparent 34%),radial-gradient(circle at 86% 18%,rgba(45,212,191,.13),transparent 30%),linear-gradient(145deg,#07111d,#0c1a29 56%,#07131f)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:32px 32px}
a{color:inherit}.shell{position:relative;z-index:1;max-width:1280px;margin:auto;padding:20px}.topbar{display:flex;gap:18px;align-items:center;justify-content:space-between;margin-bottom:18px}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:11px;color:#75d7ff;font-weight:800}.title{font-size:clamp(27px,4vw,43px);font-weight:850;margin:2px 0 4px}.subtitle{color:#a9bdd0}.clock{text-align:right;padding:12px 16px;border:1px solid rgba(117,215,255,.22);border-radius:16px;background:rgba(8,20,33,.68);backdrop-filter:blur(12px)}.clock strong{font-size:25px;display:block}.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:16px;margin-bottom:16px}.panel{background:linear-gradient(145deg,rgba(17,39,60,.88),rgba(8,24,39,.9));border:1px solid rgba(141,205,255,.16);border-radius:20px;box-shadow:0 18px 45px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.04);padding:18px}.greeting{font-size:24px;font-weight:800}.greeting span{color:#7dd3fc}.pulse{margin-top:13px;display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.metric{padding:11px;border-radius:14px;background:rgba(4,16,28,.56);border:1px solid rgba(255,255,255,.07)}.metric b{font-size:25px;display:block}.metric small{color:#aabccc}.census{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.census div{padding:12px;border-radius:14px;background:rgba(5,18,30,.62);border-left:4px solid #38bdf8}.census b{font-size:23px;display:block}.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:#8fdcff;font-weight:800;margin-bottom:12px}.main-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.task-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.task{display:flex;align-items:center;gap:12px;padding:13px;border-radius:15px;background:rgba(5,18,30,.58);border:1px solid rgba(255,255,255,.07)}.task-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:rgba(56,189,248,.13)}.task b{display:block;font-size:19px}.task span{font-size:12px;color:#aac0d2}.resident-list{max-height:412px;overflow:auto;border-radius:14px}.resident{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(4,15,25,.38)}.resident:first-child{border-radius:14px 14px 0 0}.resident:last-child{border-radius:0 0 14px 14px;border-bottom:0}.room{font-size:12px;color:#7dd3fc;font-weight:800}.name{font-size:16px;font-weight:800}.tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.tag{font-size:10px;padding:4px 7px;border-radius:999px;background:#17344c;color:#c7eaff}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 10px;border-radius:14px;border:1px solid rgba(125,211,252,.2);background:linear-gradient(145deg,rgba(24,58,83,.9),rgba(10,32,50,.9));text-decoration:none;font-weight:750;cursor:pointer;color:#eef8ff}.btn:hover{transform:translateY(-1px);border-color:#7dd3fc}.btn.primary{background:linear-gradient(135deg,#0369a1,#0e7490)}.status{font-size:12px;color:#94a9bb;margin-top:12px}.empty{color:#91a7b8;padding:20px;text-align:center}@media(max-width:850px){.hero,.main-grid{grid-template-columns:1fr}.pulse{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar"><div><div class="eyebrow">VA CLC · Local Workstation</div><div class="title">Nursing Command Center</div><div class="subtitle">One resident record feeding daily care, schedules, handoff, and printouts.</div></div><div class="clock"><strong id="clock">--:--</strong><span id="date"></span></div></div>
  <section class="hero">
    <div class="panel"><div class="greeting" id="greeting">Good morning, <span>Nurse</span></div><div class="pulse" id="pulse"></div></div>
    <div class="panel"><div class="section-title">Current Census</div><div class="census" id="census"></div></div>
  </section>
  <section class="main-grid">
    <div class="panel"><div class="section-title">Today’s Nursing Work</div><div class="task-list" id="tasks"></div><div class="actions"><a class="btn primary" href="/morning-report.html">🖨️ Morning Report</a><a class="btn" href="/charge-rn.html">⚕️ RN Workstation</a><a class="btn" href="https://clcscheduler.vercel.app/">📅 CLC Scheduler</a><button class="btn" id="exportBtn">💾 Unified Export</button></div><div class="status" id="status"></div></div>
    <div class="panel"><div class="section-title">30-Resident Master Roster</div><div class="resident-list" id="residents"></div></div>
  </section>
</div>
<script src="/shared-data.js"></script>
<script>
(function(){
  function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function updateClock(){var d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});document.getElementById('date').textContent=d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric',year:'numeric'});var h=d.getHours(),word=h<12?'morning':h<17?'afternoon':'evening';document.getElementById('greeting').innerHTML='Good '+word+', <span>'+(localStorage.getItem('mr_nurse')||'Nurse')+'</span>'}
  function render(){var due=CLCSharedData.getDueSummary(),counts=CLCSharedData.specialtyCounts();var pulse=[['Residents',due.residents.length],['Appointments',due.appointments.length],['Showers',due.showers.length],['Skin',due.skin.length],['Labs',due.labs.length]];document.getElementById('pulse').innerHTML=pulse.map(function(x){return '<div class="metric"><b>'+x[1]+'</b><small>'+x[0]+'</small></div>'}).join('');document.getElementById('census').innerHTML=Object.keys(counts).map(function(k){return '<div><b>'+counts[k]+'</b><span>'+k+'</span></div>'}).join('');var tasks=[['🚿','Showers / Baths',due.showers],['🩺','Vitals',due.vitals],['⚖️','Weights',due.weights],['🧴','Skin Assessments',due.skin],['🧪','Labs',due.labs],['🚐','Appointments',due.appointments]];document.getElementById('tasks').innerHTML=tasks.map(function(t){var names=t[2].slice(0,3).map(function(r){return r.name}).join(', ');if(t[2].length>3)names+=' +'+(t[2].length-3)+' more';return '<div class="task"><div class="task-icon">'+t[0]+'</div><div><b>'+t[2].length+'</b><span>'+t[1]+(names?'<br>'+esc(names):'')+'</span></div></div>'}).join('');document.getElementById('residents').innerHTML=due.residents.length?due.residents.map(function(r){var tags=[];if(r.bathDays.indexOf(['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date().getDay()])>=0)tags.push('Shower');if(r.fallRisk)tags.push('Fall risk');if(r.isolation&&r.isolation!=='None')tags.push(r.isolation);return '<div class="resident"><div class="room">'+esc(r.room)+'</div><div><div class="name">'+esc(r.name)+'</div><small>'+esc(r.diet)+' · '+esc(r.codeStatus)+'</small></div><div class="tags">'+tags.map(function(x){return '<span class="tag">'+esc(x)+'</span>'}).join('')+'</div></div>'}).join(''):'<div class="empty">Open RN Workstation once to initialize the 30-resident sample roster.</div>';document.getElementById('status').textContent='Data remains in this browser. Last refreshed '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+'.'}
  document.getElementById('exportBtn').addEventListener('click',function(){var blob=new Blob([JSON.stringify(CLCSharedData.exportAll(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='CLC-Unified-Backup-'+CLCSharedData.todayISO()+'.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)});
  updateClock();setInterval(updateClock,30000);render();
})();
</script>
</body></html>
