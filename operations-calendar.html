<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChargeNurse Operations Calendar</title>
<script src="auth-session.js"></script>
<script>if(!window.CLCAuth||!CLCAuth.requireAuth())throw new Error('Authentication required');</script>
<script src="clc-data.js"></script>
<style>
:root{
  --ink:#17222b;--muted:#66747d;--canvas:#e9efec;--surface:#fffdf9;
  --line:#d6ded9;--nav:#152a38;--sage:#557b69;--teal:#2f7d78;
  --gold:#a87932;--burgundy:#8c3f4b;--shadow:0 16px 44px rgba(35,42,47,.11)
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
background:linear-gradient(rgba(233,239,236,.96),rgba(233,239,236,.98)),radial-gradient(circle at 80% 0,rgba(85,123,105,.22),transparent 38%)}
.shell{max-width:1500px;margin:auto;padding:24px}
.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--sage);font-weight:900}
.title{font-size:clamp(30px,4vw,46px);font-weight:930;letter-spacing:-.04em}
.sub{color:var(--muted);margin-top:6px;max-width:760px;line-height:1.45}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 13px;border-radius:12px;text-decoration:none;font-weight:820;cursor:pointer}
.btn.active,.btn.primary{background:var(--sage);border-color:var(--sage);color:#fff}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0 14px;flex-wrap:wrap}
.viewtabs{display:flex;gap:7px}
.date-nav{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.date-label{font-size:18px;font-weight:900;min-width:230px;text-align:center}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.metric{background:rgba(255,253,249,.96);border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:0 6px 20px rgba(35,42,47,.06)}
.metric b{font-size:28px;display:block}.metric span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.metric.shower{border-top:5px solid var(--teal)}.metric.weight{border-top:5px solid var(--gold)}
.metric.vitals{border-top:5px solid var(--burgundy)}.metric.appt{border-top:5px solid var(--sage)}
.panel{background:rgba(255,253,249,.96);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:17px}
.today-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.task-panel{border-top:5px solid var(--sage)}
.task-panel.shower{border-top-color:var(--teal)}.task-panel.weight{border-top-color:var(--gold)}.task-panel.vitals{border-top-color:var(--burgundy)}
.section{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}
.section h2{margin:0;font-size:19px}.count{border-radius:999px;padding:5px 9px;background:#edf1ee;font-size:11px;font-weight:900}
.task-list{display:grid;gap:7px;max-height:58vh;overflow:auto}
.task{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center;border:1px solid #e0e5e1;background:#fbfaf6;border-radius:13px;padding:10px}
.room{font-size:11px;font-weight:900;color:var(--sage);text-transform:uppercase}.name{font-size:13px;font-weight:830}.small{font-size:10px;color:var(--muted);margin-top:2px}
.empty{text-align:center;padding:34px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.day{background:rgba(255,253,249,.96);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(35,42,47,.07);cursor:pointer}
.day.today{box-shadow:0 0 0 3px rgba(85,123,105,.24),0 8px 24px rgba(35,42,47,.07)}
.day-head{padding:12px;background:#eef2ef;border-bottom:1px solid var(--line)}.day-head b{display:block;font-size:13px}.day-head span{font-size:10px;color:var(--muted)}
.day-body{padding:10px;display:grid;gap:8px}.stat{display:flex;justify-content:space-between;gap:8px;font-size:11px;padding:7px 8px;border-radius:9px;background:#f7f4ee}.stat b{font-size:12px}
.week-detail{margin-top:14px}.week-detail h2{margin:0 0 12px}.detail-columns{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.detail-block{border:1px solid #e0e5e1;border-radius:14px;padding:11px;background:#fbfaf6}.detail-block h3{margin:0 0 8px;font-size:13px}
.detail-row{padding:7px 0;border-top:1px solid #eceeea;font-size:11px}.detail-row:first-of-type{border-top:0}
.note{margin-top:14px;padding:11px;border-radius:13px;background:#f4f1eb;color:#687279;font-size:11px;line-height:1.45}
@media(max-width:1100px){.week{grid-template-columns:repeat(4,1fr)}.today-grid{grid-template-columns:1fr 1fr}.detail-columns{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.shell{padding:14px}.top{flex-direction:column}.metrics,.today-grid,.week,.detail-columns{grid-template-columns:1fr}.date-label{min-width:auto}.toolbar{align-items:flex-start}}
@media print{.nav,.toolbar,.clc-appearance-launcher,.clc-appearance-backdrop{display:none!important}.shell{max-width:none;padding:0}.top{display:none}.metrics{grid-template-columns:repeat(4,1fr)}.metric,.panel,.day{box-shadow:none!important;border-color:#666!important}.task-list{max-height:none;overflow:visible}.today-grid{grid-template-columns:repeat(3,1fr)}.week{grid-template-columns:repeat(7,1fr)}.detail-columns{grid-template-columns:repeat(4,1fr)}.note{display:none}}
</style>
<link rel="stylesheet" href="design-system.css">
<script src="appearance.js"></script>
<link rel="stylesheet" href="print-support.css">
</head>
<body data-print-title="Operations Calendar" data-print-subtitle="Showers, weights, vitals, and appointments due">
<div class="shell">
<header class="top">
  <div>
    <div class="eyebrow">ChargeNurse · Coordination and Knowledge</div>
    <div class="title">Operations Calendar</div>
    <div class="sub">Shows who is due for showers, weights, and vitals based only on the schedules already entered during admission. No assignments and no additional documentation.</div>
  </div>
  <nav class="nav">
    <a class="btn" href="command-center.html">Command Center</a>
    <a class="btn" href="scheduler.html">Appointments</a>
    <a class="btn" href="treatment-sheets.html">Treatment Sheets</a>
    <button class="btn" onclick="window.print()">Print</button>
  </nav>
</header>

<div class="toolbar">
  <div class="viewtabs">
    <button class="btn active" id="todayTab" onclick="setView('today')">Today</button>
    <button class="btn" id="weekTab" onclick="setView('week')">Week</button>
  </div>
  <div class="date-nav">
    <button class="btn" onclick="moveDate(-1)">Previous</button>
    <div class="date-label" id="dateLabel"></div>
    <button class="btn" onclick="goToday()">Today</button>
    <button class="btn" onclick="moveDate(1)">Next</button>
  </div>
</div>

<div id="content"></div>
</div>

<script>
'use strict';
var view='today';
var selectedDate=new Date();
selectedDate.setHours(12,0,0,0);
var selectedWeekDate=new Date(selectedDate);
var dayKeys=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var longDays=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function esc(x){return String(x||'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])})}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function sameDate(a,b){return iso(a)===iso(b)}
function formatDate(d){return d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}
function startOfWeek(d){var x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-x.getDay());return x}
function due(field,d){
  var key=dayKeys[d.getDay()];
  return CLCData.residents(true).filter(function(r){return Array.isArray(r[field])&&r[field].indexOf(key)>=0})
    .sort(function(a,b){return String(a.room).localeCompare(String(b.room),undefined,{numeric:true})||a.name.localeCompare(b.name)})
}
function appointments(d){
  return CLCData.appointmentsForDate(iso(d)).slice().sort(function(a,b){return String(a.time||a.leaveTime||'').localeCompare(String(b.time||b.leaveTime||''))})
}
function taskRows(list){
  return list.length?list.map(function(r){
    return '<div class="task"><div class="room">Room '+esc(r.room||'—')+'</div><div><div class="name">'+esc(r.name)+'</div><div class="small">'+esc(r.preferredName?('Preferred: '+r.preferredName):'')+'</div></div></div>'
  }).join(''):'<div class="empty">None due.</div>';
}
function apptRows(list){
  return list.length?list.map(function(a){
    return '<div class="task"><div class="room">'+esc(a.time||a.leaveTime||'Time TBD')+'</div><div><div class="name">'+esc((a.room?('Room '+a.room+' · '):'')+(a.residentName||'Veteran'))+'</div><div class="small">'+esc(a.location||a.clinic||a.provider||'Appointment')+'</div></div></div>'
  }).join(''):'<div class="empty">No appointments.</div>';
}
function setView(v){
  view=v;
  document.getElementById('todayTab').classList.toggle('active',v==='today');
  document.getElementById('weekTab').classList.toggle('active',v==='week');
  render();
}
function moveDate(direction){
  if(view==='today')selectedDate.setDate(selectedDate.getDate()+direction);
  else selectedWeekDate.setDate(selectedWeekDate.getDate()+(direction*7));
  render();
}
function goToday(){
  selectedDate=new Date();selectedDate.setHours(12,0,0,0);
  selectedWeekDate=new Date(selectedDate);
  render();
}
function renderToday(){
  var showers=due('bathDays',selectedDate),weights=due('weightDays',selectedDate),vitals=due('vitalsDays',selectedDate),appts=appointments(selectedDate);
  document.getElementById('dateLabel').textContent=formatDate(selectedDate);
  document.getElementById('content').innerHTML=
    '<div class="metrics">'+
      '<div class="metric shower"><b>'+showers.length+'</b><span>Showers Due</span></div>'+
      '<div class="metric weight"><b>'+weights.length+'</b><span>Weights Due</span></div>'+
      '<div class="metric vitals"><b>'+vitals.length+'</b><span>Vitals Due</span></div>'+
      '<div class="metric appt"><b>'+appts.length+'</b><span>Appointments</span></div>'+
    '</div>'+
    '<div class="today-grid">'+
      '<section class="panel task-panel shower"><div class="section"><h2>Showers</h2><span class="count">'+showers.length+' due</span></div><div class="task-list">'+taskRows(showers)+'</div></section>'+
      '<section class="panel task-panel weight"><div class="section"><h2>Weights</h2><span class="count">'+weights.length+' due</span></div><div class="task-list">'+taskRows(weights)+'</div></section>'+
      '<section class="panel task-panel vitals"><div class="section"><h2>Vitals</h2><span class="count">'+vitals.length+' due</span></div><div class="task-list">'+taskRows(vitals)+'</div></section>'+
    '</div>'+
    '<section class="panel" style="margin-top:14px"><div class="section"><h2>Appointments</h2><span class="count">'+appts.length+' scheduled</span></div><div class="task-list">'+apptRows(appts)+'</div></section>'+
    '<div class="note">This screen is read-only. Shower, weight, and vital schedules continue to be maintained in the existing admission/Veteran modal.</div>';
}
function renderWeek(){
  var start=startOfWeek(selectedWeekDate),days=[],today=new Date();today.setHours(12,0,0,0);
  for(var i=0;i<7;i++){var d=new Date(start);d.setDate(start.getDate()+i);days.push(d)}
  document.getElementById('dateLabel').textContent=start.toLocaleDateString(undefined,{month:'long',day:'numeric'})+' – '+days[6].toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});
  var cards=days.map(function(d){
    return '<article class="day '+(sameDate(d,today)?'today':'')+'" onclick="selectWeekDay(\''+iso(d)+'\')">'+
      '<div class="day-head"><b>'+longDays[d.getDay()]+'</b><span>'+d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+'</span></div>'+
      '<div class="day-body">'+
        '<div class="stat"><span>Showers</span><b>'+due('bathDays',d).length+'</b></div>'+
        '<div class="stat"><span>Weights</span><b>'+due('weightDays',d).length+'</b></div>'+
        '<div class="stat"><span>Vitals</span><b>'+due('vitalsDays',d).length+'</b></div>'+
        '<div class="stat"><span>Appointments</span><b>'+appointments(d).length+'</b></div>'+
      '</div></article>';
  }).join('');
  var detailDate=days.find(function(d){return sameDate(d,selectedDate)})||days[0];
  selectedDate=new Date(detailDate);
  document.getElementById('content').innerHTML='<div class="week">'+cards+'</div><div id="weekDetail"></div><div class="note">Select a day to see exactly who is due. The calendar does not create or change schedules.</div>';
  renderWeekDetail(detailDate);
}
function selectWeekDay(value){
  selectedDate=new Date(value+'T12:00:00');
  renderWeekDetail(selectedDate);
}
function simpleRows(list){
  return list.length?list.map(function(r){return '<div class="detail-row"><b>Room '+esc(r.room||'—')+'</b> · '+esc(r.name)+'</div>'}).join(''):'<div class="detail-row">None due.</div>';
}
function simpleAppts(list){
  return list.length?list.map(function(a){return '<div class="detail-row"><b>'+esc(a.time||a.leaveTime||'TBD')+'</b> · '+esc((a.room?('Room '+a.room+' · '):'')+(a.residentName||'Veteran'))+'</div>'}).join(''):'<div class="detail-row">No appointments.</div>';
}
function renderWeekDetail(d){
  var el=document.getElementById('weekDetail');if(!el)return;
  el.innerHTML='<section class="panel week-detail"><h2>'+formatDate(d)+'</h2><div class="detail-columns">'+
    '<div class="detail-block"><h3>Showers</h3>'+simpleRows(due('bathDays',d))+'</div>'+
    '<div class="detail-block"><h3>Weights</h3>'+simpleRows(due('weightDays',d))+'</div>'+
    '<div class="detail-block"><h3>Vitals</h3>'+simpleRows(due('vitalsDays',d))+'</div>'+
    '<div class="detail-block"><h3>Appointments</h3>'+simpleAppts(appointments(d))+'</div>'+
  '</div></section>';
}
function render(){view==='today'?renderToday():renderWeek()}
window.addEventListener('clc:datachange',render);
render();
</script>
<script src="print-support.js"></script>
</body>
</html>
