<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChargeNurse Morning Report</title>
<script src="auth-session.js"></script>
<script>if(!window.CLCAuth||!CLCAuth.requireAuth())throw new Error('Authentication required');</script>
<script src="clc-data.js"></script>
<style>
:root{--ink:#18242d;--muted:#667680;--paper:#fffefa;--line:#cfd8d4;--accent:#416c60;--accent2:#a56f2c;--wash:#edf3f0;--shadow:0 20px 55px rgba(25,40,47,.15)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(120deg,rgba(225,235,231,.94),rgba(239,235,225,.94)),radial-gradient(circle at 10% 10%,#d1e0da,transparent 45%);min-height:100vh}
.shell{max-width:1540px;margin:auto;padding:24px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.toolbar h1{margin:0;font-size:clamp(28px,4vw,44px);letter-spacing:-.04em}.toolbar p{margin:4px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:rgba(255,255,255,.88);color:var(--ink);padding:10px 14px;border-radius:999px;text-decoration:none;font-weight:800;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}
.report{background:rgba(255,254,250,.97);box-shadow:var(--shadow);border:1px solid rgba(112,132,124,.25);border-radius:28px;padding:28px 30px;overflow:hidden;position:relative}.report:before{content:"";position:absolute;top:0;left:0;right:0;height:7px;background:linear-gradient(90deg,var(--accent),#7e9e91,var(--accent2))}.report-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:10px}.report-head h2{font-size:30px;margin:0;letter-spacing:-.025em}.date{font-size:15px;font-weight:800}
.census{display:flex;gap:26px;flex-wrap:wrap;padding:8px 0 12px;font-weight:800}.census span b{font-size:20px;margin-left:5px}.section{margin-top:18px}.section-title{display:flex;align-items:center;gap:10px;margin:0 0 7px;font-size:15px;text-transform:uppercase;letter-spacing:.09em}.section-title:after{content:"";height:1px;background:linear-gradient(90deg,var(--accent),transparent);flex:1}.empty{font-size:12px;color:var(--muted);font-style:italic;padding:4px 0 8px}
.census-table{width:100%;border-collapse:collapse;table-layout:auto;font-size:10px}.census-table th,.census-table td{border:1px solid #9eaaa5;padding:4px 5px;vertical-align:top;white-space:nowrap}.census-table th{background:#e7eeea;text-transform:uppercase;letter-spacing:.02em;font-size:9px}.census-table .veteran{min-width:115px}.census-table .notes{width:100%;min-width:230px;white-space:normal;height:38px}.census-table td.notes{background:repeating-linear-gradient(to bottom,transparent 0,transparent 17px,#d8dedb 18px)}
.rows{display:grid;gap:2px}.report-row{display:flex;align-items:baseline;gap:18px;flex-wrap:nowrap;padding:5px 7px;border-bottom:1px dotted #aeb9b4;font-size:12px;min-height:28px}.report-row:last-child{border-bottom:0}.item{white-space:nowrap}.item strong{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#53645d;margin-right:4px}.item.name{min-width:200px}.item.where{flex:1;white-space:normal}.routine-row .item.name{min-width:260px}
@media(max-width:900px){.shell{padding:12px}.report{padding:20px 14px;border-radius:18px}.toolbar{align-items:flex-start;flex-direction:column}.report-row{overflow:auto}.census-table{display:block;overflow:auto}.census-table .notes{min-width:180px}}
@page{size:landscape;margin:0}
@media print{body{background:#fff}.shell{max-width:none;padding:0}.toolbar{display:none}.report{border:0;box-shadow:none;border-radius:0;padding:0;background:#fff}.report:before{display:none}.report-head{margin-bottom:5px}.report-head h2{font-size:20px}.date{font-size:11px}.census{padding:3px 0 6px;gap:22px;font-size:10px}.census span b{font-size:12px}.section{margin-top:9px}.section-title{font-size:10px;margin-bottom:3px}.census-table{font-size:7.5px}.census-table th{font-size:7px;padding:2px 3px}.census-table td{padding:2px 3px}.census-table .veteran{min-width:92px}.census-table .notes{min-width:220px;height:29px}.census-table td.notes{background:repeating-linear-gradient(to bottom,transparent 0,transparent 12px,#ddd 13px)}.report-row{font-size:9px;min-height:19px;padding:2px 4px;gap:14px}.item strong{font-size:7.5px}.item.name{min-width:150px}.routine-row .item.name{min-width:210px}.empty{font-size:8px}.section,.census-table tr,.report-row{break-inside:avoid}}
</style>
<link rel="stylesheet" href="futuristic-ui.css">
</head>
<body class="cn-future">
<div class="shell">
  <header class="toolbar">
    <div><h1>Morning Report</h1><p>Today's CLC census and scheduled care.</p></div>
    <div class="actions"><a class="btn" href="index.html">Home</a><a class="btn" href="veterans.html">Veterans</a><a class="btn" href="scheduler.html">Scheduler</a><button class="btn primary" onclick="window.print()">Print Report</button></div>
  </header>
  <main class="report">
    <div class="report-head"><h2>Morning Report</h2><div class="date" id="reportDate"></div></div>
    <div class="census" id="census"></div>
    <section class="section"><h3 class="section-title">Veteran Census</h3><div id="veteranCensus"></div></section>
    <section class="section" id="showersSection"><h3 class="section-title">Showers Due</h3><div class="rows" id="showers"></div></section>
    <section class="section" id="weightsSection"><h3 class="section-title">Weights Due</h3><div class="rows" id="weights"></div></section>
    <section class="section" id="vitalsSection"><h3 class="section-title">Vitals Due</h3><div class="rows" id="vitals"></div></section>
    <section class="section" id="skinSection"><h3 class="section-title">Skin Assessments Due</h3><div class="rows" id="skin"></div></section>
    <section class="section" id="appointmentsSection"><h3 class="section-title">Today's Appointments</h3><div class="rows" id="appointments"></div></section>
  </main>
</div>
<script>
'use strict';
var dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])})}
function todayISO(){var d=new Date(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return d.getFullYear()+'-'+m+'-'+day}
function daysOnUnit(date){if(!date)return '—';var a=new Date(date+'T00:00:00'),b=new Date();b.setHours(0,0,0,0);var n=Math.floor((b-a)/86400000)+1;return n>0?n:0}
function specialtyLabel(v){var x=String(v||'').toLowerCase();if(x==='ltc'||x.indexOf('long')>=0)return 'LTC';if(x.indexOf('short')>=0||x==='str')return 'Short Stay';if(x.indexOf('respite')>=0)return 'Respite';if(x.indexOf('hospice')>=0)return 'Hospice';return v||'—'}
function group(v){var x=String(v.specialty||'').toLowerCase();if(x==='ltc'||x.indexOf('long')>=0)return 'Long Term';if(x.indexOf('short')>=0||x==='str'||x.indexOf('rehab')>=0)return 'Short Stay';if(x.indexOf('respite')>=0)return 'Respite';if(x.indexOf('hospice')>=0)return 'Hospice';return 'Long Term'}
function isDue(days){return Array.isArray(days)&&days.indexOf(dayNames[new Date().getDay()])>=0}
function roomSort(a,b){return String(a.room||'').localeCompare(String(b.room||''),undefined,{numeric:true})||String(a.name||'').localeCompare(String(b.name||''))}
function row(parts,cls){return '<div class="report-row '+(cls||'')+'">'+parts.map(function(p){return '<span class="item '+(p.cls||'')+'"><strong>'+esc(p.label)+':</strong>'+esc(p.value||'—')+'</span>'}).join('')+'</div>'}
function renderRoutine(id,rows,extra){var el=document.getElementById(id);if(!rows.length){el.innerHTML='<div class="empty">None due today.</div>';return}el.innerHTML=rows.sort(roomSort).map(function(r){var p=[{label:'Room',value:r.room},{label:'Name',value:r.name,cls:'name'}];if(extra)p.push(extra(r));return row(p,'routine-row')}).join('')}
function render(){
 var residents=CLCData.residents().sort(roomSort),today=todayISO(),day=new Date();
 document.getElementById('reportDate').textContent=day.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});
 var counts={'Short Stay':0,'Long Term':0,'Respite':0,'Hospice':0};residents.forEach(function(r){counts[group(r)]++});
 document.getElementById('census').innerHTML=['Short Stay','Long Term','Respite','Hospice'].map(function(k){return '<span>'+k+': <b>'+counts[k]+'</b></span>'}).join('');
 var html='<table class="census-table"><thead><tr><th>Room</th><th>Specialty</th><th>Code</th><th class="veteran">Veteran / Last 4</th><th>Diet</th><th>Meds</th><th>Assist</th><th>Toilet</th><th>Isolation</th><th>Assistance</th><th>Days</th><th class="notes">Notes</th></tr></thead><tbody>';
 html+=residents.map(function(r){return '<tr><td>'+esc(r.room||'—')+'</td><td>'+esc(specialtyLabel(r.specialty))+'</td><td>'+esc(r.codeStatus||'—')+'</td><td class="veteran">'+esc(r.name+(r.last4?' - '+r.last4:''))+'</td><td>'+esc(r.diet||'—')+'</td><td>'+esc(r.medicationAdministration||'—')+'</td><td>'+esc(r.assistLevel||'—')+'</td><td>'+esc(r.toileting||'—')+'</td><td>'+esc(r.isolation||'None')+'</td><td>'+esc(r.assistance||'—')+'</td><td>'+esc(daysOnUnit(r.admissionDate))+'</td><td class="notes"></td></tr>'}).join('');
 html+='</tbody></table>';document.getElementById('veteranCensus').innerHTML=html;
 renderRoutine('showers',residents.filter(function(r){return isDue(r.bathDays)}),function(r){return{label:'Shift',value:r.showerShift||'—'}});
 renderRoutine('weights',residents.filter(function(r){return isDue(r.weightDays)}));
 renderRoutine('vitals',residents.filter(function(r){return isDue(r.vitalsDays)}));
 renderRoutine('skin',residents.filter(function(r){return isDue(r.skinDays)}));
 var appts=CLCData.appointmentsForDate(today).sort(function(a,b){return String(a.time||'').localeCompare(String(b.time||''))});
 document.getElementById('appointments').innerHTML=appts.length?appts.map(function(a){return row([{label:'Name',value:a.residentName||'—',cls:'name'},{label:'Leave',value:a.leaveTime||'—'},{label:'Appointment',value:a.time||'—'},{label:'With Who',value:a.provider||a.clinic||'—'},{label:'Where At',value:a.location||'—',cls:'where'}])}).join(''):'<div class="empty">No appointments scheduled today.</div>';
}
window.addEventListener('clc:datachange',render);render();
</script>
</body>
</html>
